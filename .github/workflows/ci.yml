name: CI

on:
  push:
    branches: [main, platform-design]
  pull_request:

jobs:
  functions:
    name: Functions and security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:rules
      - name: Integration tests against the emulators
        run: |
          # The Functions emulator needs every secret; dummy values are enough
          # (sending mail fails, which the functions tolerate).
          printf '%s=dummy\n' SENDGRID_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET APPLE_IAP_KEY APPLE_SIGNIN_KEY > .secret.local
          npm run test:integration

  admin:
    name: Admin webapp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx eslint
      # Next generates route types (LayoutProps, PageProps) that tsc needs.
      - run: npm run typecheck
      - run: npm run build

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-wasm-dry-run
