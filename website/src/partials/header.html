<header class="site-header"{{SOLID}}>
  <div class="wrap">
    <a class="brand" href="{{href.index}}" aria-label="{{t.home_label}}">
      <img src="{{BASE}}assets/img/gentle-logo.svg" alt="Gentle" width="92" height="45">
    </a>
    <nav class="nav" aria-label="{{t.main_menu}}">
        {{NAV}}
    </nav>
    <div class="header-actions">
      <a class="login" href="{{APP_URL}}">{{t.login}}</a>
      <a class="btn btn-primary btn-sm" href="{{APP_URL}}">{{t.cta}}</a>
      <button class="menu-toggle" type="button" data-menu-open aria-expanded="false" aria-controls="mobile-menu"><i class="ph-light ph-list" aria-hidden="true"></i><span class="sr-only">{{t.menu_open}}</span></button>
    </div>
  </div>
</header>
<div class="mobile-menu" id="mobile-menu" aria-hidden="true">
  <button class="menu-toggle mobile-menu-close" type="button" data-menu-close><i class="ph-light ph-x" aria-hidden="true"></i><span class="sr-only">{{t.menu_close}}</span></button>
  <nav aria-label="{{t.mobile_menu}}">
        <a href="{{href.index}}">Home</a>
        {{NAV}}
  </nav>
  <div style="display:grid;gap:10px">
    <a class="btn btn-primary" href="{{APP_URL}}">{{t.cta}}</a>
    <a class="btn btn-quiet" href="{{APP_URL}}">{{t.login}}</a>
    <a class="lang-switch" href="{{OTHER_HREF}}" hreflang="{{OTHER_LANG}}" lang="{{OTHER_LANG}}"><i class="ph-light ph-globe-simple" aria-hidden="true"></i>{{OTHER_LABEL}}</a>
  </div>
</div>
<main id="main">
